name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.13 explicitly — never let CI drift to 3.14 (NFR-14).
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync (dev only — no heavy/real extras; everything external is mocked)
        run: uv sync --dev

      - name: Ruff (zero failures — NFR-9)
        run: uv run ruff check .

      - name: File-size guard — ≤150 lines raw AND logical (NFR-8)
        run: uv run python scripts/check_file_lines.py

      - name: Version single-source sync (NFR-6)
        run: uv run python scripts/check_version_sync.py

      - name: Tests + coverage ≥85% (NFR-7/10, fully mocked — no keys/servers)
        run: uv run pytest
