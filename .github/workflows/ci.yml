name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Python 3.13 explicitly — never let CI drift to 3.14 (NFR-14).
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync (dev only, frozen lockfile — no heavy/real extras; externals mocked)
        run: uv sync --dev --frozen

      - name: Ruff (zero failures — NFR-9)
        run: uv run ruff check .

      - name: File-size guard — ≤150 lines raw AND logical (NFR-8)
        run: uv run python scripts/check_file_lines.py

      - name: Version single-source sync (NFR-6)
        run: uv run python scripts/check_version_sync.py

      - name: Tests + coverage ≥85% (NFR-7/10, fully mocked — no keys/servers)
        run: uv run pytest

      - name: Offline self-match smoke — the grader path (0 tokens, no keys)
        run: |
          uv run cipherchase self-match --config config/police --out /tmp/smoke --at 2026-08-01T00:00:00Z
          test "$(ls /tmp/smoke/*.json | wc -l)" -eq 4

      - name: README test-count honesty guard (IH-28)
        run: |
          n="$(uv run pytest --collect-only -q 2>/dev/null | grep -oE '^[0-9]+ tests collected' | grep -oE '^[0-9]+')"
          echo "collected: $n"; grep -q "$n tests" README.md
