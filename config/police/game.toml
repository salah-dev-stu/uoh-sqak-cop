version = "1.00"

[game]
group_name = "uoh-sqak"
group_id = "uoh-sqak"
role = "police"
sub_game_number = 1
# Counted league series played so far (friendlies never count).
counted_games_played = 0
# Only this group's agreements may consume a handshake window. Empty =
# accept whoever answers. Set per match by `peer --opponent <id>`.
opponent_group_id = ""
members = ["Salah Qadah:323039974", "Andalus Kalash:211435797"]
repos = { cop = "https://github.com/salah-dev-stu/uoh-sqak-cop", thief = "https://github.com/salah-dev-stu/uoh-sqak-thief" }

[belief]
smell_trust = 4.0
alpha = 0.85

[strategy]
police_class = "cipherchase.strategy.apex_cop:ApexCop"
thief_class = "cipherchase.strategy.thief_evader_v2:EvaderBrain"
w_center = 0.5
w_belief = 1.0
w_dist = 1.0
w_exits = 0.3
w_risk = 1.0
lambda_barrier = 0.2
min_gain = 1
# Claim "are you here?" only when belief mass on our own cell reaches this.
# A claim names our cop's cell exactly, so an unconditional one donates our
# position every turn; 0 restores unconditional claiming.
claim_mass_threshold = 0.08
# ApexCop (P6): best-response over an opponent model + exact endgame proof.
# opponent_model: thief_v1 | evader_v2 | naive_edge | still | random | paranoid | ensemble
# ("ensemble" = league-robust hedge over the deterministic archetypes).
opponent_model = "ensemble"
apex_lock_mass = 0.5
apex_w_reach = 1.0
apex_w_dist = 0.6
apex_w_wall = 0.8
apex_barrier_topk = 3
apex_endgame_depth = 8
apex_endgame_nodes = 50000
apex_endgame_wall = 2
apex_endgame_gap = 4
# Strategic bluffing (F8): "strategic" = rule picks intent (cop bluffs when close,
# thief when cornered); "random" = bluff at lie_probability. Sealed & audited either way.
deception = "random"
bluff_gap_threshold = 3
bluff_weight = 0.0  # Bayesian hint-fusion pull (F6); 0 disables, ~0.15 to enable

[trash_talk]
provider = "template"
every_n_steps = 3
lie_probability = 0.4
# Setting flavour for grounded hints (F6). Private — never the signed game.json.
landmarks = ["Harlem", "Central Park", "the waterfront", "Brooklyn Bridge", "Wall Street", "Times Square"]

[scent]
# Named emit model (SPEC §7), declared to the opponent as `scent_model_sha256`.
# "subtractive_chebyshev_v1" = the league CORE registration; "multiplicative_cheb"
# = our own profile. Both peers must name the same one or the physics differ.
model = "multiplicative_cheb"

[play]
seed = 2

[network]
host = "127.0.0.1"
my_port = 8001
# Public tunnel URL advertised in the Step-0 declaration (rule 49); empty = local.
public_url = ""
opponent_url = "http://127.0.0.1:8002/mcp"
turn_timeout_seconds = 180
poll_interval_seconds = 0.5
connect_timeout_seconds = 60
retry_interval_seconds = 1.0
# Patience at ONE sub-game index, in SECONDS. Must exceed one turn timeout so we
# can outwait a peer stuck in a zero-turn window; attempts are not a unit of patience.
index_patience_seconds = 240
handshake_retries = 5
audit_send_timeout_seconds = 10
queue_maxsize = 100

[llm]
model = "template"
version = "n/a"
executable = "claude"
step_deadline_seconds = 8.0

[email]
recipient = "rmisegal+uoh26finalgame@gmail.com"
sender = "skadah324@gmail.com"
enabled = false
subject_template = "CipherChase report {game_id}"
