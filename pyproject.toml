[project]
name = "cipherchase"
description = "CipherChase — Distributed Cops-and-Robbers over a Peer-to-Peer Network (uoh-sqak final project)"
authors = [
    { name = "Salah Qadah" },
    { name = "Andalus Kalash" },
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
cipherchase = "cipherchase.cli:main"

[project.optional-dependencies]
# Heavy / external runtime deps used only for the REAL pipeline (live LLM,
# real Gmail send, GUI). Tests and CI never install these — every external
# op is mocked, so the grader needs no API key, no creds, no display.
real = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cipherchase/shared/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cipherchase"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells conventionally sys.path.insert before importing (E402), and
# import order across separate cells (I001) is not meaningful.
"*.ipynb" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov=cipherchase --cov-report=term-missing --cov-fail-under=85"
