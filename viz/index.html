<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CipherChase — Masterclass 3D Arena</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="hud-top">
  <h1>CipherChase</h1>
  <div class="sub">Zero-trust pursuit · commit–reveal audited</div>
</div>
<canvas id="spark" width="220" height="56"
  title="cyan: cop–thief gap · magenta: belief error"
  aria-label="sparkline of cop-thief distance and belief error"></canvas>
<div id="chips" aria-live="polite">
  <span class="chip"><span class="dot dot-cop"></span>Cop</span>
  <span class="chip"><span class="dot dot-thief"></span>Thief</span>
  <span class="chip">gap <b id="gap">–</b></span>
  <span class="chip">barriers <b id="nbar">0</b></span>
  <span class="chip">score <b id="score">0 : 0</b></span>
</div>
<aside id="rail" aria-label="commit-reveal evidence rail" tabindex="0"></aside>
<div id="banner" role="status" aria-live="assertive"></div>
<div id="popover" hidden></div>
<div id="ring" hidden aria-hidden="true"></div>
<div id="scoreboard" hidden>
  <h2 id="sb-title"></h2>
  <div id="sb-score"></div>
  <div class="sb-note">N new match · space replay</div>
</div>
<div id="hint-ticker" aria-live="polite">
  <span id="badge" hidden></span><span id="hint-text">···</span>
</div>
<div id="keys">drag orbit · space play · ←/→ step · 1/2/3 view · N new · S shot · Q quality</div>
<div id="bar" role="toolbar" aria-label="replay transport">
  <button id="play" aria-label="play or pause">Pause</button>
  <span id="turn">turn 0/0</span>
  <div id="scrubwrap">
    <div id="marks" aria-hidden="true"></div>
    <input id="scrub" type="range" min="0" max="0" value="0" step="0.01"
      aria-label="scrub through turns" />
  </div>
  <div class="seg" id="speeds" aria-label="playback speed">
    <button data-s="0.5">0.5×</button>
    <button data-s="1" class="on">1×</button>
    <button data-s="2">2×</button>
  </div>
  <div class="seg" id="viewseg" aria-label="view mode">
    <button data-v="1" title="Cop view — what the cop knows">1</button>
    <button data-v="2" title="Thief view — what the thief knows">2</button>
    <button data-v="3" class="on" title="Truth view — omniscient replay">3</button>
  </div>
  <button id="fixture" aria-pressed="false"
    title="toggle honest / tampered replay fixture">Honest</button>
  <button id="quality" aria-label="quality: high or low">HQ</button>
  <button id="new">New match</button>
</div>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/addons/"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
